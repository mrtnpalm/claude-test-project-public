<!doctype html>
<html lang="et">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Soengu proovija</title>
  <style>
    :root { --bg: #f6f4f1; --card: #fff; --ink: #222; --muted: #777; --accent: #c2410c; --line: #e5e1dc; }
    * { box-sizing: border-box; }
    body { margin: 0; font-family: system-ui, sans-serif; background: var(--bg); color: var(--ink); }
    header { padding: 16px; text-align: center; }
    h1 { margin: 0; font-size: 1.6rem; }
    header p { margin: 4px 0 0; color: var(--muted); }
    main { max-width: 960px; margin: 0 auto; padding: 0 16px 32px; display: grid; gap: 16px; grid-template-columns: 1fr; }
    @media (min-width: 760px) { main { grid-template-columns: 340px 1fr; } }
    .card { background: var(--card); border: 1px solid var(--line); border-radius: 14px; padding: 16px; }
    #avatar svg { width: 100%; max-width: 300px; display: block; margin: 0 auto; }
    .group { margin-bottom: 14px; }
    .group h3 { margin: 0 0 6px; font-size: .85rem; text-transform: uppercase; letter-spacing: .05em; color: var(--muted); }
    .opts { display: flex; flex-wrap: wrap; gap: 6px; }
    .opts button { border: 1px solid var(--line); background: #fff; border-radius: 999px; padding: 6px 12px; cursor: pointer; font: inherit; }
    .opts button.on { border-color: var(--accent); background: var(--accent); color: #fff; }
    .opts button.swatch { width: 32px; height: 32px; padding: 0; }
    .opts button.swatch.on { outline: 3px solid var(--accent); outline-offset: 2px; background: inherit; }
    .actions { display: flex; gap: 8px; flex-wrap: wrap; margin-top: 12px; }
    .actions button, .save button { font: inherit; padding: 8px 14px; border-radius: 8px; border: 1px solid var(--line); background: #fff; cursor: pointer; }
    .save { display: flex; gap: 8px; margin-top: 12px; }
    .save input { flex: 1; min-width: 0; font: inherit; padding: 8px; border: 1px solid var(--line); border-radius: 8px; }
    .save button { background: var(--accent); color: #fff; border-color: var(--accent); }
    #msg { min-height: 1.2em; color: var(--muted); font-size: .9rem; margin: 6px 0 0; }
    #saved { display: grid; grid-template-columns: repeat(auto-fill, minmax(100px, 1fr)); gap: 10px; }
    .look { border: 1px solid var(--line); border-radius: 10px; padding: 6px; text-align: center; cursor: pointer; position: relative; background: #fff; }
    .look svg { width: 100%; }
    .look span { font-size: .8rem; display: block; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
    footer { border-top: 1px solid var(--line); padding: 16px; text-align: center; color: var(--muted); font-size: .85rem; }
    footer p { margin: 0; }
    .look .del { position: absolute; top: 2px; right: 2px; border: 0; background: #fff; border-radius: 50%; width: 22px; height: 22px; cursor: pointer; color: var(--muted); }
  </style>
</head>
<body>
  <header>
    <h1>Soengu proovija</h1>
    <p>Vali modell ja proovi erinevaid soenguid ja stiile</p>
  </header>
  <main>
    <section class="card">
      <div id="avatar"></div>
      <div class="actions">
        <button id="random">🎲 Juhuslik</button>
        <button id="reset">↺ Lähtesta</button>
      </div>
      <div class="save">
        <input id="name" maxlength="40" placeholder="Looki nimi">
        <button id="save">Salvesta look</button>
      </div>
      <p id="msg"></p>
    </section>
    <section>
      <div class="card" id="controls"></div>
      <div class="card" style="margin-top:16px">
        <div class="group"><h3>Salvestatud lookid</h3></div>
        <div id="saved"></div>
      </div>
    </section>
  </main>
  <footer>
    <p>© <span id="year"></span> Soengu proovija · Tehtud lõbu pärast · Built with Claude Code.</p>
  </footer>
  <script>document.getElementById('year').textContent = new Date().getFullYear();</script>
  <script src="app.js"></script>
</body>
</html>
